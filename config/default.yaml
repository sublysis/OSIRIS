input:
  comment_prefix: "#"

fetcher:
  user_agent: "OSIRIS osint-tool/0.2 (+research; contact via config)"
  timeout: 20
  min_delay_per_domain: 2.0
  respect_robots: true
  max_bytes: 2000000
  fetch_favicon: true
  favicon_max_bytes: 512000

search:
  default_provider: searxng
  providers:
    searxng:
      base_url: "http://localhost:8080"
    brave:
      enabled: false
      # api_key in config/secrets.yaml
    serpapi:
      enabled: false

nlp:
  # https://github.com/explosion/spacy-models
  # spacy_model: "de_core_news_lg"
  spacy_model: "en_core_web_md"
  keyphrase_lang: "en"
  keyphrase_top: 20
  stylometry_threshold: 0.0

whois:
  rdap_base_url: "https://rdap.org/domain"
  timeout: 15
  min_delay: 1.0

certs:
  crtsh_base_url: "https://crt.sh"
  timeout: 30
  min_delay: 2.0
  max_results: 200

correlate:
  min_score: 0.3
  stylometry_min: 0.3
  weights:
    stylometry: 0.5
    shared_domain: 0.4
    shared_entity: 0.6
    seed_in_doc: 0.7
    shared_registrant: 0.5
    shared_favicon: 0.6
    shared_cert: 0.7

report:
  db_path: "data/osint.sqlite"
  output_dir: "reports"

localfiles:
  max_bytes: 20000000
  timeout: 60

cases:
  root_dir: "cases"

guardrails:
  max_paid_search_calls_per_case: 20