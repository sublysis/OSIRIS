# Kopiere diese Datei zu config/secrets.yaml (gitignored) und trage Keys ein.
# Wird automatisch ueber default.yaml gemergt.

search:
  default_provider: searxng   # oder: brave, serpapi
  providers:
    brave:
      enabled: true
      api_key: "DEIN_BRAVE_KEY"
    serpapi:
      enabled: true
      api_key: "DEIN_SERPAPI_KEY"
