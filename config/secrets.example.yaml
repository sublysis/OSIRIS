# Copy this file to config/secrets.yaml (gitignored) and fill in your keys.
# Automatically merged on top of default.yaml.

search:
  default_provider: searxng   # or: brave, serpapi
  providers:
    brave:
      enabled: true
      api_key: "YOUR_BRAVE_KEY"
    serpapi:
      enabled: true
      api_key: "YOUR_SERPAPI_KEY"
